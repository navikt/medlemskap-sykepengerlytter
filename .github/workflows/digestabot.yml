name: Digestabot Update
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
jobs:
  digestabot-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run Digestabot
        uses: navikt/digestabot@3302a753e533ceb9ec216de7f78345436cd636e3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          team: medlemskap
